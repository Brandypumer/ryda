<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="RYDA is a campus mobility MVP for Keke rides and point-to-point package or document delivery." />
    <meta name="theme-color" content="#09665d" />
    <link rel="icon" type="image/png" href="/ryda_logo.png" />
    <title>RYDA — Campus Rides &amp; Courier</title>
  </head>
  <body>
    <script>
      (() => {
        try {
          const preference = localStorage.getItem('ryda.theme') || 'system';
          const dark = window.matchMedia('(prefers-color-scheme: dark)').matches;
          document.documentElement.dataset.theme = preference === 'system' ? (dark ? 'dark-plus' : 'light-plus') : preference;
          document.documentElement.dataset.themePreference = preference;
        } catch (_) {}
      })();
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
